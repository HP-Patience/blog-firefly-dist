<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000"><title>雾蓝泳池与彭罗斯循环楼梯</title><desc>无人拱廊前悬浮着四段首尾相接的阶梯，清晰踏步在矛盾的透视中形成闭环，下方水面映出朦胧倒影。</desc><defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#cad2db"/><stop offset="1" stop-color="#d8e3ef"/></linearGradient>
  <linearGradient id="wall" x2="1" y2=".4"><stop stop-color="#d8e2ec"/><stop offset="1" stop-color="#b9c4cf"/></linearGradient>
  <linearGradient id="side" x2="1" y2=".4"><stop stop-color="#8a9bae"/><stop offset="1" stop-color="#b7c2cd"/></linearGradient>
  <linearGradient id="water" x2=".3" y2="1"><stop stop-color="#4d7898"/><stop offset=".5" stop-color="#88aec5"/><stop offset="1" stop-color="#bfd6e3"/></linearGradient>
  <linearGradient id="dark" x2="1" y2="0"><stop stop-color="#17222e"/><stop offset="1" stop-color="#576a7e"/></linearGradient>
  <linearGradient id="light" x2="0" y2="1"><stop stop-color="#ebf1f7" stop-opacity=".85"/><stop offset="1" stop-color="#ebf1f7" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#eef3f8" stop-opacity=".75"/><stop offset="1" stop-color="#eef3f8" stop-opacity="0"/></radialGradient>
  <pattern id="tiles" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#4f5f71" stroke-opacity=".18" stroke-width="1"/></pattern>
  <pattern id="smalltiles" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M19 0H0V19" fill="none" stroke="#d6e0ea" stroke-opacity=".3" stroke-width=".8"/></pattern>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="pool"><path d="M385 583H1160L1105 1020H-160Z"/></clipPath>

  <!-- Stair topology adapted from Sakurambo / Philip Ronan, public domain.
       https://commons.wikimedia.org/wiki/File:Impossible_staircase.svg
       Local adaptation: blue materials, tile joints, lighting, placement and reflection. -->
  <linearGradient id="stair-tread" x2="0" y2="1"><stop stop-color="#f0f5fa"/><stop offset="1" stop-color="#d3e0ed"/></linearGradient>
  <linearGradient id="stair-front" x2=".3" y2="1"><stop stop-color="#bacddd"/><stop offset="1" stop-color="#7f9ab3"/></linearGradient>
  <linearGradient id="stair-inner" x2="1" y2=".3"><stop stop-color="#536e8b"/><stop offset="1" stop-color="#8ba4ba"/></linearGradient>
  <pattern id="stair-tiles" width="18.5" height="9" patternUnits="userSpaceOnUse"><path d="M18.5 0H0V9" fill="none" stroke="#3e5c79" stroke-opacity=".15" stroke-width=".35"/></pattern>
  <filter id="reflection-blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.5 1.2"/></filter>
  <path id="penrose-tread" d="m0,0 37,18 -37,18 -37,-18 z"/>
  <path id="stair-inside-wall" d="m279,36 -37,18 v-8 l-37,18 v-8 l-37,18 v-8 l-37,18 v-8 l-37,18 v77 h185 z"/>
  <path id="stair-front-wall" d="m20,159 v-73 l37,18 v-8 l37,18 v-8 l37,18 v-8 l37,18 v-8 l37,18 v-8 l37,18 v113 z"/>
  <path id="stair-right-wall" d="m353,86 -37,18 v7 l-37,18 v7 l-37,18 v113 l111,-54 z"/>
  <g id="penrose-staircase" transform="translate(345 160) scale(2 1.18)" stroke="#607f9a" stroke-width=".7" stroke-linejoin="round" fill="url(#stair-tread)">
    <!-- Painter order is essential: these shared landings create the impossible loop. -->
    <use href="#penrose-tread" x="242" y="18"/>
    <use href="#penrose-tread" x="205" y="28"/>
    <use href="#penrose-tread" x="168" y="38"/>
    <use href="#penrose-tread" x="131" y="48"/>
    <use href="#penrose-tread" x="94" y="58"/>
    <use href="#penrose-tread" x="57" y="68"/>
    <use href="#stair-inside-wall" fill="url(#stair-inner)"/>
    <use href="#stair-inside-wall" fill="url(#stair-tiles)" stroke="none"/>
    <use href="#penrose-tread" x="279" y="43"/>
    <path fill="#7593ae" d="m316,61 v7 l-37,18 v-7 z"/>
    <path fill="url(#stair-front)" d="m316,104 -37,-18 v-7 l-37,-18 v99 h74 z"/>
    <use href="#penrose-tread" x="94" y="78"/>
    <use href="#penrose-tread" x="131" y="88"/>
    <use href="#penrose-tread" x="168" y="98"/>
    <use href="#penrose-tread" x="205" y="108"/>
    <use href="#penrose-tread" x="242" y="118"/>
    <use href="#penrose-tread" x="279" y="93"/>
    <use href="#penrose-tread" x="316" y="68"/>
    <use href="#stair-right-wall" fill="url(#stair-inner)"/>
    <use href="#stair-right-wall" fill="url(#stair-tiles)" stroke="none"/>
    <use href="#stair-front-wall" fill="url(#stair-front)"/>
    <use href="#stair-front-wall" fill="url(#stair-tiles)" stroke="none"/>
  </g>
</defs><g filter="url(#grain)">
