<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">从 push 到上线</title><desc id="desc">从左到右依次为本地推送、runner 验证构建、生产服务器更新。runner 内按编号拉取代码、准备环境、安装依赖、测试、构建和打包，然后 SCP 上传、SSH 部署，服务器依次解压、切换版本、重启和健康检查。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
<style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111}.title{font-size:32px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#555}.code{font-family:Consolas,'Microsoft YaHei',monospace;font-size:21px}.panel{fill:#e7e7e7;stroke:#555;stroke-width:1.5}.node{fill:white;stroke:#111;stroke-width:1.5}.arrow{fill:none;stroke:#333;stroke-width:2.5;marker-end:url(#arrow)}.center{text-anchor:middle}</style></defs>
<rect width="1440" height="620" fill="#f6f6f6"/>
<text class="title" x="32" y="52">从 push 到上线</text>
<text class="small" x="32" y="87">从左往右看发布阶段；各阶段内部按编号执行。构建留在 runner，服务器只运行产物。</text>
<rect class="node" x="32" y="252" width="242" height="166" rx="10"/>
<text class="head center" x="153" y="296">本地推送</text>
<text class="code center" x="153" y="342">git push</text>
<text class="code center" x="153" y="374">origin master</text>
<path class="arrow" d="M282 335 H344"/><text class="small center" x="312" y="318">触发</text>
<rect class="panel" x="352" y="130" width="450" height="448" rx="10"/>
<text class="head" x="374" y="169">GitHub Actions runner</text>
<text class="small" x="374" y="199">workflow 开始运行 · 验证与构建</text>
<rect class="node" x="370" y="218" width="414" height="44" rx="7"/><text class="body" x="384" y="247">① 拉取代码</text><text class="code" x="536" y="247">actions/checkout</text>
<rect class="node" x="370" y="273" width="414" height="44" rx="7"/><text class="body" x="384" y="302">② 准备环境</text><text class="code" x="536" y="302">actions/setup-node</text>
<rect class="node" x="370" y="328" width="414" height="44" rx="7"/><text class="body" x="384" y="357">③ 安装依赖</text><text class="code" x="536" y="357">npm ci</text>
<rect class="node" x="370" y="383" width="414" height="44" rx="7"/><text class="body" x="384" y="412">④ 运行测试</text><text class="code" x="536" y="412">npm run test</text>
<rect class="node" x="370" y="438" width="414" height="44" rx="7"/><text class="body" x="384" y="467">⑤ 构建应用</text><text class="code" x="536" y="467">npm run build</text>
<rect class="node" x="370" y="493" width="414" height="44" rx="7"/><text class="body" x="384" y="522">⑥ 打包产物</text><text class="code" x="536" y="522">standalone 压缩包</text>
<text class="small" x="374" y="561">前面的步骤成功后，继续上传和部署</text>
<path class="arrow" d="M810 335 H992"/>
<text class="body center" x="901" y="302">SCP 上传产物</text>
<text class="small center" x="901" y="372">SSH 执行部署</text>
<rect class="panel" x="1000" y="130" width="408" height="448" rx="10"/>
<text class="head" x="1022" y="169">生产服务器</text>
<text class="small" x="1022" y="199">接收产物 · 更新服务</text>
<rect class="node" x="1018" y="218" width="372" height="66" rx="7"/><text class="body" x="1034" y="243">⑦ 解压到新 release</text><text class="code" x="1034" y="269">releases/&lt;commit-sha&gt;</text>
<rect class="node" x="1018" y="294" width="372" height="66" rx="7"/><text class="body" x="1034" y="319">⑧ 切换 current 软链接</text><text class="code" x="1034" y="345">current → 新 release</text>
<rect class="node" x="1018" y="370" width="372" height="66" rx="7"/><text class="body" x="1034" y="395">⑨ 重启应用服务</text><text class="code" x="1034" y="421">systemd</text>
<rect class="node" x="1018" y="446" width="372" height="66" rx="7"/><text class="body" x="1034" y="471">⑩ 健康检查</text><text class="small" x="1034" y="497">curl 检查服务是否正常响应</text>
<text class="head center" x="1204" y="561">检查通过，完成发布</text>
</svg>